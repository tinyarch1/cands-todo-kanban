<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo 칸반</title>
<style>
body{margin:0;font-family:Pretendard,'Malgun Gothic',system-ui;background:#f6f8f7;color:#1f2937}
header{background:linear-gradient(135deg,#12a05c,#0b7a45);color:#fff;padding:16px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}header small{opacity:.9}
button{border:0;border-radius:8px;padding:8px 14px;background:#fff;color:#0b7a45;font-weight:600;cursor:pointer}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;max-width:1200px;margin:auto}
@media(max-width:700px){main{grid-template-columns:1fr}}
.col{background:#fff;border-radius:12px;padding:12px;min-height:60vh;border-top:4px solid #12a05c}
.col.done{border-color:#6b7280}.col h2{margin:4px 8px 12px;font-size:16px}
.card{background:#e8f6ee;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.done .card{background:#f1f2f4;color:#6b7280}.card b{display:block}.card small{color:#6b7280}
.card a{color:#0b7a45;font-size:12px}.card .act{float:right}.card .act button{background:#12a05c;color:#fff;padding:3px 8px;font-size:12px}
.over{outline:2px dashed #12a05c}.stale{opacity:.6}
#add{display:flex;gap:6px;margin:0 8px 10px}#add input{flex:1;padding:8px;border:1px solid #d1d5db;border-radius:8px}
#err{background:#fff7d6;padding:8px 24px;display:none}
</style></head><body>
<header><h1>Todo 칸반 · cands 동기화</h1><small id="sync"></small><button onclick="doSync()">지금 동기화</button></header>
<div id="err"></div>
<main><section class="col" id="doing"><h2>Doing <span id="n1"></span></h2><div id="add"><input id="t" placeholder="직접 추가"><button style="background:#12a05c;color:#fff" onclick="add()">추가</button></div><div class="list"></div></section>
<section class="col done" id="done"><h2>Done <span id="n2"></span></h2><div class="list"></div></section></main>
<script>
let pw=localStorage.pw||"";
async function api(p,body){let r=await fetch("/api/"+p,{method:body?"POST":"GET",headers:{"x-app-password":pw,"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
 if(r.status==401){pw=prompt("비밀번호")||"";localStorage.pw=pw;return api(p,body)}return r.json()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(b){
 document.getElementById("sync").textContent="마지막 동기화: "+(b.lastSync?new Date(b.lastSync).toLocaleString("ko-KR"):"없음");
 const e=document.getElementById("err");e.style.display=b.lastError?"block":"none";e.textContent="동기화 오류: "+(b.lastError||"");
 for(const s of ["doing","done"]){const L=document.querySelector("#"+s+" .list");const items=b.items.filter(i=>i.status===s);
  document.getElementById(s=="doing"?"n1":"n2").textContent="("+items.length+")";
  L.innerHTML=items.map(i=>`<div class="card ${i.stale?"stale":""}" draggable="true" data-id="${esc(i.id)}"><span class="act"><button onclick="mv('${esc(i.id)}','${s=="doing"?"done":"doing"}')">${s=="doing"?"Done ›":"‹ Doing"}</button></span><b>${esc(i.title)}</b><small>${esc(i.phase)} ${esc((i.nodes||[]).join(", "))}</small> ${i.href?`<a href="${esc(i.href)}" target="_blank">열기</a>`:""}</div>`).join("")}
 document.querySelectorAll(".card").forEach(c=>c.ondragstart=ev=>ev.dataTransfer.setData("id",c.dataset.id))}
async function mv(id,status){render(await api("move",{id,status}))}
async function add(){const t=document.getElementById("t");if(!t.value)return;render(await api("add",{title:t.value}));t.value=""}
async function doSync(){render(await api("sync",{}))}
document.querySelectorAll(".col").forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add("over")};c.ondragleave=()=>c.classList.remove("over");
 c.ondrop=e=>{e.preventDefault();c.classList.remove("over");mv(e.dataTransfer.getData("id"),c.id)}});
api("todos").then(b=>{render(b);if(!b.lastSync)doSync()});setInterval(()=>api("todos").then(render),300000);
</script></body></html>
